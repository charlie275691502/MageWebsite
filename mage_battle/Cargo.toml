[package]
name = "mage_battle"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"

# HTTP Server
axum = "0.6"
tokio = { version = "1.28", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["cors", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID for game IDs
uuid = { version = "1.0", features = ["v4", "serde"] }

# Async
async-trait = "0.1"

# State management
dashmap = "5.5"
